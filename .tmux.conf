# remap prefix to Control + a
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Mouse support - set to on if you want to use the mouse
set -g mouse on # For tmux 2.1+

# Set the default terminal mode to 256color mode
set -g default-terminal "screen-256color"
#  enable terminal compability
set-option -ga terminal-overrides ",xterm-256color:Tc"

# Forward extended keys (CSI u) so apps can tell Ctrl+Shift+<key> from Ctrl+<key>
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features "xterm*:extkeys"

# enable activity alerts
setw -g monitor-activity on
set -g visual-activity on

# Center the window list
set -g status-justify centre

# Set zsh as default shell
set-option -g default-shell /bin/zsh

# Quick pane cycling
unbind ^A
bind ^A select-pane -t :.+

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

# tmux-resurrect

## Restore vim sessions with vim-resurrect
set -g @resurrect-strategy-nvim 'session'
#set -g @resurrect-strategy-vim 'session'

## Enable scrollback after tmux-resurrect restores a session
set -g @resurrect-capture-pane-contents 'on'

# Reattach each new window to the user bootstrap namespace
# https://github.com/ChrisJohnsen/tmux-MacOSX-pasteboard
#set -g default-command "reattach-to-user-namespace -l $SHELL"

# Use vim bindings to select pane
set-window-option -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Copy-paste integration
bind-key -T copy-mode-vi 'v' send -X begin-selection

# Use vim keybindings in copy mode
setw -g mode-keys vi

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

